models:
  - model_idx: gpt-6-astra-direct
    provider: openrouter
    display_name: GPT-6 Astra (direct batch)
    name: gpt-6-astra
    context_length: 1050000
    max_output_tokens: 32768
    supports_tools: true
    supports_json: true
    cost_per_1m_input_tokens: 5.0
    cost_per_1m_output_tokens: 25.0
    role: "direct HLE solver"
    best_for: "Direct scientific and mathematical problem solving without conductor routing."
    client:
      type: openai_compatible
      base_url: https://openrouter.ai/api/v1
      # OpenRouter displays the discounted catalog entry as
      # openai/gpt-6-astra:batch, but its native Batch API accepts the base
      # model slug here and applies batch routing/pricing at submission time.
      model: openai/gpt-6-astra
      native_batch: true
      batch_backend: openrouter
      batch_poll_interval_seconds: 30

